set -g mouse on

# keybinds for gemini cli
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n S-Enter send-keys C-j
bind -n S-PPage copy-mode -u
bind -T copy-mode S-PPage send-keys -X page-up
bind -T copy-mode S-NPage send-keys -X page-down

# keybinds
# https://qiita.com/youichiro/items/dd54c38c2f3873348c78
bind \\ split-window -h
bind - split-window -v
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'