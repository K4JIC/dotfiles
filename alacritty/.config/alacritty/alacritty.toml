[general]
import=[
"~/.config/alacritty/alacritty-theme/themes/gruvbox_dark.toml"
]

[font]
size=11.0
offset={x=0,y=4}
normal={family="JetBrainsMono",style="Regular"}
bold={family="JetBrainsMono",style="bold"}
italic={family="JetBrainsMono",style="italic"}

[terminal.shell]
program="sh"
args=["-c","tmux new-session -t default || tmux new-session -s default"]
